<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease;
    }

    h1 {
      color: #ff4d6d;
      font-size: 1.8em;
      margin-bottom: 15px;
    }

    button {
      margin-top: 18px;
      padding: 10px 22px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #ff4d6d, #ff758f);
      color: white;
      font-size: 0.9em;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .hidden {
      display: none;
    }

    /* FOTO */
    .slideshow, .couple-slideshow {
      position: relative;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slideshow {
      width: 160px;
      height: 160px;
    }

    .couple-slideshow {
      width: 260px;
      height: 260px;
    }

    .slideshow img,
    .couple-slideshow img {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 1s ease;
    }

    .slideshow img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ff4d6d;
    }

    .couple-slideshow img {
      width: 260px;
      height: 260px;
      border-radius: 25px;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    img.active {
      opacity: 1;
    }

    /* TYPING */
    .typing {
      color: #ff4d6d;
      font-weight: bold;
      font-size: 1.05em;
      line-height: 1.7;
      min-height: 160px;
      white-space: pre-line;
      margin-top: 15px;
    }

    .next-btn {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- HALAMAN AWAL -->
<div class="card" id="awal">
  <h1>🎂 Happy Birthday 💖</h1>

  <div class="slideshow">
    <img src="foto1.jpg" class="active">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
  </div>

  <button onclick="showKejutan()">Klik untuk kejutan 🎁</button>
</div>

<!-- HALAMAN KEJUTAN -->
<div class="card hidden" id="kejutanPage">
  <h1>💗 Untuk Kamu 💗</h1>

  <div class="couple-slideshow">
    <img src="couple1.jpg" class="active">
    <img src="couple2.jpg">
    <img src="couple3.jpg">
    <img src="couple4.jpg">
  </div>

  <div id="typingText" class="typing"></div>

  <button id="nextBtn" class="next-btn" onclick="nextSlide()">
    Lanjut 💌
  </button>
</div>

<audio id="musik" src="music.mp3"></audio>

<script>
  const awal = document.getElementById("awal");
  const kejutanPage = document.getElementById("kejutanPage");
  const typingText = document.getElementById("typingText");
  const nextBtn = document.getElementById("nextBtn");
  const musik = document.getElementById("musik");

  /* SLIDESHOW */
  let a = 0, b = 0;
  const fotoAwal = document.querySelectorAll(".slideshow img");
  const fotoCouple = document.querySelectorAll(".couple-slideshow img");

  setInterval(() => {
    fotoAwal[a].classList.remove("active");
    a = (a + 1) % fotoAwal.length;
    fotoAwal[a].classList.add("active");
  }, 2500);

  setInterval(() => {
    fotoCouple[b].classList.remove("active");
    b = (b + 1) % fotoCouple.length;
    fotoCouple[b].classList.add("active");
  }, 3000);

  /* TEKS PER SLIDE */
  const texts = [
`Terima kasih sudah hadir dalam hidupku 🤍
Setiap hari bersamamu selalu berarti 💕
Di hari ulang tahunmu ini,
aku berharap kamu selalu bahagia ✨`,

`Semoga langkahmu selalu dimudahkan 🌷
Mimpimu satu per satu tercapai
Dan aku berharap,
aku masih bisa menemanimu 🤍`,

`Apa pun yang terjadi nanti,
ingatlah…
kamu adalah seseorang
yang sangat berharga bagiku 💖`
  ];

  let slideIndex = 0;
  let charIndex = 0;

  function typeText() {
    if (charIndex < texts[slideIndex].length) {
      typingText.innerHTML += texts[slideIndex].charAt(charIndex++);
      setTimeout(typeText, 75);
    } else {
      if (slideIndex < texts.length - 1) {
        nextBtn.style.display = "block";
      }
    }
  }

  function nextSlide() {
    slideIndex++;
    typingText.innerHTML = "";
    charIndex = 0;
    nextBtn.style.display = "none";
    typeText();
  }

  function showKejutan() {
    awal.classList.add("hidden");
    kejutanPage.classList.remove("hidden");
    musik.play();
    typeText();
  }
</script>

</body>
</html>
